# Intégration continue — ERP AGEROUTE
#
# Constat de la revue du 22/08/2026 : aucun pipeline versionné ; les résultats
# de tests n'étaient « observés » que sur le poste de celui qui déployait, sans
# trace attachée au commit. Ici chaque push et chaque pull request produit une
# preuve durable : types, tests, build — sur Node 20, la version de l'image de
# production (node:20-slim).
#
# Ce pipeline ne déploie RIEN. Le déploiement reste une opération humaine,
# décrite dans DEPLOIEMENT.md, après sauvegarde et répétition sur copie.
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Sources
        uses: actions/checkout@v4
      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Dependances
        run: npm ci
      - name: Client Prisma (generation seule, jamais db push)
        run: npx prisma generate
      - name: Types
        run: npx tsc --noEmit
      - name: Tests unitaires (les preuves PostgreSQL sont ignorees sans PG_TEST)
        run: node scripts/run-tests.mjs
      - name: Build
        run: npm run build
      - name: Garde - aucun secret versionne
        working-directory: .
        run: |
          if git ls-files | grep -E '(^|/)\.env(\.|$)' | grep -v '\.env\.example$'; then
            echo "Un fichier .env est versionne" >&2
            exit 1
          fi
          if git ls-files | grep -Ei '\.(p12|pfx|jks|pem|key)$'; then
            echo "Une cle ou un certificat est versionne" >&2
            exit 1
          fi
      - name: Garde - rien du laboratoire de signature en production
        working-directory: .
        run: |
          # Mandat signature §6 : SoftHSM2, EJBCA CE, SignServer CE ou une URL
          # de laboratoire dans un manifeste de production = echec.
          if grep -Eiq 'softhsm|ejbca-ce|signserver-ce|labo-signserver|labo-dss|laboratoire-signature' docker-compose.yml; then
            echo "Le manifeste de production reference le laboratoire de signature" >&2
            exit 1
          fi
          if grep -Eiq 'SIGNATURE_PRODUCTION_AUTORISEE' docker-compose.yml; then
            echo "SIGNATURE_PRODUCTION_AUTORISEE ne doit pas figurer dans le manifeste (porte NO-GO)" >&2
            exit 1
          fi

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Sources
        uses: actions/checkout@v4
      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Dependances
        run: npm ci
      - name: Types
        run: npx tsc --noEmit
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
