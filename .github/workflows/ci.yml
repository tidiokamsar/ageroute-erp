# Intégration continue — ERP AGEROUTE
#
# Constat de la revue du 22/08/2026 : aucun pipeline versionné ; les résultats
# de tests n'étaient « observés » que sur le poste de celui qui déployait, sans
# trace attachée au commit. Ici chaque push et chaque pull request produit une
# preuve durable : types, tests, build — sur Node 20, la version de l'image de
# production (node:20-slim).
#
# Ce pipeline ne déploie RIEN. Le déploiement reste une opération humaine,
# décrite dans DEPLOIEMENT.md, après sauvegarde et répétition sur copie.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — types, tests, build
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: backend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Client Prisma (génération seule — jamais db push)
        run: npx prisma generate
      - name: Types
        run: npx tsc --noEmit
      - name: Tests unitaires (les preuves PostgreSQL sont ignorées sans PG_TEST)
        run: node scripts/run-tests.mjs
      - name: Build
        run: npm run build
      - name: Garde — aucun secret versionné
        run: |
          if git ls-files | grep -E '(^|/)\.env(\.|$)' | grep -v '\.env\.example$'; then
            echo "Un fichier .env est versionné" >&2; exit 1; fi
          if git ls-files | grep -Ei '\.(p12|pfx|jks|pem|key)$'; then
            echo "Une clé ou un certificat est versionné" >&2; exit 1; fi

  frontend:
    name: Frontend — types, tests, build
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Types
        run: npx tsc --noEmit
      - name: Tests
        run: npm test -- --run
      - name: Build
        run: npm run build
